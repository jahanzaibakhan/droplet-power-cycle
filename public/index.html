<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Power Cycle</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0e;
      --bg-elev: #14161a;
      --card: #1a1d23;
      --text: #e8eaed;
      --muted: #9aa3af;
      --line: #2a2f38;
      --chip: #2b3038;
      --accent: #4d8dff;
      --accent-hover: #6aa0ff;
      --vultr: #51b9ff;
      --ok: #3dd68c;
      --ok-bg: #123526;
      --warn: #f5c16c;
      --warn-bg: #3a2d12;
      --danger: #ff6b6b;
      --danger-bg: #3a1518;
      --info: #9ec1ff;
      --info-bg: #152238;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #182033 0%, transparent 55%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.75rem 1.25rem 3rem;
    }
    .tabs {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .tab {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      font-size: 0.85rem;
      font-weight: 650;
      cursor: pointer;
    }
    .tab.active {
      color: #071018;
      border-color: transparent;
    }
    .tab.active[data-provider="digitalocean"] { background: var(--accent); }
    .tab.active[data-provider="vultr"] { background: var(--vultr); }
    .tab:disabled { opacity: 0.4; cursor: not-allowed; }
    .kicker {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      margin: 0 0 0.55rem;
    }
    .kicker.do { color: var(--accent); }
    .kicker.vultr { color: var(--vultr); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.45rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
      margin: 0 0 1.6rem;
    }
    code, .chip {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      background: var(--chip);
      border-radius: 6px;
      padding: 0.12rem 0.4rem;
      color: #d5dbe7;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.35rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.78rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      background: var(--bg-elev);
      color: var(--text);
    }
    input[type="text"]:focus {
      outline: 2px solid #3159a8;
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 0.55rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 0.68rem 0.95rem;
      font-size: 0.92rem;
      font-weight: 650;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .primary { background: var(--accent); color: #071018; }
    .primary.vultr { background: var(--vultr); }
    .primary:hover:not(:disabled) { filter: brightness(1.08); }
    .ghost { background: #262b34; color: var(--text); }
    .danger { background: #8f2d32; color: #ffe9ea; }
    .okbtn { background: #1d6b45; color: #ddffe9; }
    .meta { margin-top: 0.95rem; color: var(--muted); font-size: 0.78rem; }
    .panel {
      margin-top: 1rem;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.05rem;
      display: none;
    }
    .panel.show { display: block; }
    .panel h2 { margin: 0 0 0.7rem; font-size: 0.95rem; font-weight: 650; }
    .facts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: 0.65rem 1rem;
    }
    .fact span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      padding: 0.18rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: capitalize;
    }
    .pill::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: currentColor;
    }
    .pill.active, .pill.running { background: var(--ok-bg); color: var(--ok); }
    .pill.off, .pill.stopped { background: #2a2e36; color: #b7bec9; }
    .pill.new { background: var(--warn-bg); color: var(--warn); }
    .status {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      white-space: pre-wrap;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      line-height: 1.45;
    }
    .status.show { display: block; }
    .status.info { background: var(--info-bg); color: var(--info); }
    .status.ok { background: var(--ok-bg); color: var(--ok); }
    .status.err { background: var(--danger-bg); color: var(--danger); }
    .status.warn { background: var(--warn-bg); color: var(--warn); }
    .footer {
      margin-top: 1.75rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .footer strong { color: #c5ceda; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-provider="digitalocean">DigitalOcean</button>
      <button type="button" class="tab" data-provider="vultr">Vultr</button>
    </div>

    <p class="kicker do" id="kicker">DigitalOcean</p>
    <h1 id="title">Droplet control</h1>
    <p class="sub" id="subtitle">Look up a server by public IPv4, then power cycle, stop, or start it.</p>

    <div class="card">
      <label for="ip">Public IPv4</label>
      <input id="ip" type="text" list="server-options" placeholder="161.35.221.71" autocomplete="off" />
      <datalist id="server-options"></datalist>

      <div class="panel" id="server-panel">
        <h2 id="panel-title">Current droplet</h2>
        <div class="facts" id="server-facts"></div>
      </div>

      <div class="row">
        <button class="primary" id="cycle-btn" type="button" data-action="power_cycle">Power cycle</button>
        <button class="danger" id="stop-btn" type="button" data-action="stop">Stop</button>
        <button class="okbtn" id="start-btn" type="button" data-action="start">Start</button>
        <button class="ghost" id="refresh-btn" type="button">Refresh list</button>
      </div>
      <p class="meta" id="meta">Loading…</p>
      <div class="status" id="status" role="status"></div>
    </div>
    <p class="footer">Cloud Power Cycle · <strong id="app-version">v…</strong></p>
  </main>

  <script>
    const PROVIDERS = {
      digitalocean: {
        label: "DigitalOcean",
        kickerClass: "do",
        title: "Droplet control",
        panelTitle: "Current droplet",
        entity: "droplet",
        listKey: "droplets",
        listPath: () => "/api/droplets",
        searchPath: (q) => "/api/droplets?q=" + encodeURIComponent(q),
        instancePath: (ip) => "/api/droplet?ip=" + encodeURIComponent(ip),
        refreshPath: () => "/api/refresh",
        actionPath: () => "/api/action",
        statusPath: (ctx) =>
          "/api/action-status/" + encodeURIComponent(ctx.actionId) +
          "?droplet_id=" + encodeURIComponent(ctx.resourceId) + "&t=" + Date.now(),
        parseInstance: (data) => data.droplet,
        parseList: (data) => data.droplets || [],
        metaIndexing: "indexing DigitalOcean",
      },
      vultr: {
        label: "Vultr",
        kickerClass: "vultr",
        title: "Instance control",
        panelTitle: "Current instance",
        entity: "instance",
        listKey: "instances",
        listPath: () => "/api/vultr/instances",
        searchPath: (q) => "/api/vultr/instances?q=" + encodeURIComponent(q),
        instancePath: (ip) => "/api/vultr/instance?ip=" + encodeURIComponent(ip),
        refreshPath: () => "/api/vultr/refresh",
        actionPath: () => "/api/vultr/action",
        statusPath: (ctx) =>
          "/api/vultr/action-status?instance_id=" + encodeURIComponent(ctx.resourceId) +
          "&action=" + encodeURIComponent(ctx.action) +
          "&started_at=" + encodeURIComponent(ctx.startedAt) + "&t=" + Date.now(),
        parseInstance: (data) => data.instance,
        parseList: (data) => data.instances || [],
        metaIndexing: "indexing Vultr",
      },
    };

    const ipInput = document.getElementById("ip");
    const datalist = document.getElementById("server-options");
    const refreshBtn = document.getElementById("refresh-btn");
    const meta = document.getElementById("meta");
    const statusEl = document.getElementById("status");
    const panel = document.getElementById("server-panel");
    const facts = document.getElementById("server-facts");
    const cycleBtn = document.getElementById("cycle-btn");
    const actionBtns = Array.from(document.querySelectorAll("[data-action]"));
    const tabBtns = Array.from(document.querySelectorAll(".tab"));

    const ACTION_COPY = {
      power_cycle: { verb: "power cycle", doing: "Power cycling", done: "power cycle completed" },
      stop: { verb: "stop", doing: "Stopping", done: "powered off" },
      start: { verb: "start", doing: "Starting", done: "started" },
    };

    let provider = "digitalocean";
    let enabled = { digitalocean: true, vultr: true };
    let servers = [];
    let pollTimer = null;
    let suggestTimer = null;
    let lookupTimer = null;
    let busy = false;

    function cfg() {
      return PROVIDERS[provider];
    }

    function showStatus(kind, text) {
      statusEl.className = "status show " + kind;
      statusEl.textContent = text;
    }

    function setBusy(on, label) {
      busy = on;
      actionBtns.forEach((btn) => {
        btn.disabled = on;
      });
      cycleBtn.textContent = on && label ? label : "Power cycle";
      refreshBtn.disabled = on;
    }

    function clearPoll() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
    }

    function currentIp() {
      let ip = ipInput.value.trim();
      const named = ip.match(/\((\d{1,3}(?:\.\d{1,3}){3})\)\s*$/);
      if (named) ip = named[1];
      return ip;
    }

    function lookupByIp(ip) {
      return servers.find((d) => d.ip === ip);
    }

    function renderDatalist() {
      datalist.innerHTML = "";
      servers.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d.ip;
        opt.label = d.name + " (" + d.ip + ")";
        opt.textContent = d.name + " (" + d.ip + ")";
        datalist.appendChild(opt);
      });
    }

    function statusPill(d) {
      const p = provider === "vultr"
        ? (d.power_status || d.status || "unknown")
        : (d.status || "unknown");
      const cls =
        p === "active" || p === "running" ? "active running"
        : p === "off" || p === "stopped" ? "off stopped"
        : "new";
      return '<span class="pill ' + cls + '">' + p + "</span>";
    }

    function renderServer(d) {
      if (!d) {
        panel.classList.remove("show");
        return;
      }
      facts.innerHTML =
        fact("Name", d.name) +
        fact("Status", statusPill(d), true) +
        (provider === "vultr" && d.server_status
          ? fact("Server", d.server_status)
          : "") +
        fact("IP", '<span class="chip">' + (d.ip || "—") + "</span>", true) +
        fact("ID", d.id) +
        fact("Region", d.region || "—") +
        fact("Size", d.size || "—");
      panel.classList.add("show");
    }

    function fact(label, value, html) {
      return (
        '<div class="fact"><span>' + label + "</span><strong>" +
        (html ? value : String(value == null ? "—" : value)) +
        "</strong></div>"
      );
    }

    function applyProviderUi() {
      const c = cfg();
      document.getElementById("kicker").textContent = c.label;
      document.getElementById("kicker").className = "kicker " + c.kickerClass;
      document.getElementById("title").textContent = c.title;
      document.getElementById("panel-title").textContent = c.panelTitle;
      cycleBtn.classList.toggle("vultr", provider === "vultr");
      tabBtns.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.provider === provider);
      });
    }

    async function loadList() {
      const c = cfg();
      const res = await fetch(c.listPath(), { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load list");
      servers = c.parseList(data);
      renderDatalist();
      const count = data.count != null ? data.count : servers.length;
      const when = data.lastRefreshAt ? new Date(data.lastRefreshAt).toLocaleString() : "never";
      let line = count + " public IP(s) cached · last refresh " + when;
      if (data.refreshing) line += " · still " + c.metaIndexing + "…";
      if (data.knownTotal) line += " · account total " + data.knownTotal;
      if (data.truncated) line += " · type to search by name or IP";
      if (data.lastRefreshError) line += " · last error: " + data.lastRefreshError;
      meta.textContent = line;
    }

    async function suggest(q) {
      if (!q || q.length < 2) return;
      const c = cfg();
      const res = await fetch(c.searchPath(q), { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) return;
      servers = c.parseList(data);
      renderDatalist();
    }

    async function loadServerCard(ip) {
      if (!/^(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(ip)) {
        renderServer(null);
        return;
      }
      const c = cfg();
      const res = await fetch(c.instancePath(ip), { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) {
        renderServer(null);
        return;
      }
      renderServer(c.parseInstance(data));
    }

    function actionSettled(kind, data, startedAt) {
      const status = String(data.status || "").toLowerCase().replace(/_/g, "-");
      if (provider === "vultr") {
        if (status === "completed") return "completed";
        if (Date.now() - startedAt > 180000) return "timeout";
        return null;
      }
      const dropletStatus = String(data.droplet_status || "").toLowerCase();
      if (status === "completed" || status === "errored") return status;
      if (Date.now() - startedAt < 8000) return null;
      if ((kind === "power_cycle" || kind === "start") && dropletStatus === "active") return "completed";
      if (kind === "stop" && dropletStatus === "off") return "completed";
      return null;
    }

    function resourceStatusLine(data) {
      if (provider === "vultr") {
        return "power: " + (data.power_status || "?") + " · server: " + (data.server_status || "?");
      }
      return "droplet: " + (data.droplet_status || "?");
    }

    async function pollStatus(kind, ctx, name, ip, startedAt) {
      const copy = ACTION_COPY[kind];
      const c = cfg();
      try {
        const res = await fetch(c.statusPath({ ...ctx, action: kind, startedAt }), { cache: "no-store" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Status check failed");

        const settled = actionSettled(kind, data, startedAt);
        if (settled === "completed") {
          setBusy(false);
          showStatus("ok", name + " (" + ip + ") " + copy.done + ".\n" + resourceStatusLine(data));
          loadServerCard(ip).catch(() => {});
          return;
        }
        if (settled === "errored") {
          setBusy(false);
          showStatus("err", name + " (" + ip + ") " + copy.verb + " errored.");
          loadServerCard(ip).catch(() => {});
          return;
        }
        if (settled === "timeout") {
          setBusy(false);
          showStatus("warn", copy.doing + " " + name + " still in progress after 3 minutes.\n" + resourceStatusLine(data));
          loadServerCard(ip).catch(() => {});
          return;
        }

        showStatus(
          "info",
          copy.doing + " " + name + " (" + ip + ")...\naction: " + (data.status || "in-progress") +
          " · " + resourceStatusLine(data)
        );
        pollTimer = setTimeout(() => pollStatus(kind, ctx, name, ip, startedAt), 2000);
      } catch (err) {
        setBusy(false);
        showStatus("err", err.message);
      }
    }

    async function runAction(kind) {
      const ip = currentIp();
      const copy = ACTION_COPY[kind];
      const c = cfg();
      if (!ip) {
        showStatus("err", "Enter a public IPv4 address.");
        return;
      }

      let known = lookupByIp(ip);
      if (!known) {
        try {
          const look = await fetch(c.searchPath(ip), { cache: "no-store" });
          const lookData = await look.json();
          known = c.parseList(lookData).find((d) => d.ip === ip) || null;
        } catch (_) {}
      }
      const name = known ? known.name : "this server";
      if (!confirm("Are you sure you want to " + copy.verb + " " + name + " (" + ip + ")?")) return;

      clearPoll();
      const startedAt = Date.now();
      setBusy(true, copy.doing + "…");
      showStatus("info", "Starting " + copy.verb + " for " + name + " (" + ip + ")…");

      try {
        const res = await fetch(c.actionPath(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ ip, action: kind }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        const serverName =
          data.droplet_name || data.instance_name || (known && known.name) || "server";
        const resourceId = data.droplet_id || data.instance_id;
        const actionId = data.action_id || resourceId;
        showStatus("info", copy.doing + " " + serverName + " (" + ip + ")…");
        pollStatus(kind, { actionId, resourceId, startedAt }, serverName, ip, startedAt);
      } catch (err) {
        setBusy(false);
        showStatus("err", err.message);
      }
    }

    function switchProvider(next) {
      if (!enabled[next]) {
        showStatus("err", PROVIDERS[next].label + " is not configured on this server.");
        return;
      }
      provider = next;
      servers = [];
      renderDatalist();
      renderServer(null);
      clearPoll();
      setBusy(false);
      statusEl.className = "status";
      applyProviderUi();
      loadList().catch((err) => {
        meta.textContent = "Could not load list.";
        showStatus("err", err.message);
      });
    }

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => switchProvider(btn.dataset.provider));
    });

    actionBtns.forEach((btn) => {
      btn.addEventListener("click", () => runAction(btn.dataset.action));
    });

    refreshBtn.addEventListener("click", async () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing…";
      try {
        const res = await fetch(cfg().refreshPath(), { method: "POST", cache: "no-store" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Refresh failed");
        showStatus("ok", "List refresh started.");
        loadList().catch(() => {});
      } catch (err) {
        showStatus("err", err.message);
      } finally {
        refreshBtn.disabled = busy;
        refreshBtn.textContent = "Refresh list";
      }
    });

    ipInput.addEventListener("input", () => {
      const q = ipInput.value.trim();
      clearTimeout(suggestTimer);
      clearTimeout(lookupTimer);
      suggestTimer = setTimeout(() => suggest(currentIp() || q).catch(() => {}), 250);
      lookupTimer = setTimeout(() => loadServerCard(currentIp()).catch(() => {}), 400);
    });

    fetch("/api/version", { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        document.getElementById("app-version").textContent = "v" + (d.version || "?");
        if (d.providers) {
          enabled = d.providers;
          tabBtns.forEach((btn) => {
            btn.disabled = !enabled[btn.dataset.provider];
          });
          if (!enabled[provider]) {
            provider = enabled.vultr ? "vultr" : "digitalocean";
          }
        }
        applyProviderUi();
        return loadList();
      })
      .catch((err) => {
        document.getElementById("app-version").textContent = "v1.2.0";
        meta.textContent = "Could not load list.";
        showStatus("err", err.message);
      });
  </script>
</body>
</html>
